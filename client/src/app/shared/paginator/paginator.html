<nav class="paginator" aria-label="דפדוף">
  <button type="button" (click)="first()" [disabled]="disabled() || isFirst()">ראשון</button>
  <button type="button" (click)="previous()" [disabled]="disabled() || isFirst()">קודם</button>

  <ol class="pages">
    @for (link of links(); track link.kind === 'page' ? link.page : link.id) {
      <li>
        @if (link.kind === 'page') {
          <button
            type="button"
            [class.active]="link.page === currentPage()"
            [attr.aria-current]="link.page === currentPage() ? 'page' : null"
            [disabled]="disabled()"
            (click)="go(link.page)">
            {{ link.page | bigNumber }}
          </button>
        } @else {
          <span class="gap" aria-hidden="true">…</span>
        }
      </li>
    }
  </ol>

  <button type="button" (click)="next()" [disabled]="disabled() || isLast()">הבא</button>
  <button type="button" (click)="last()" [disabled]="disabled() || isLast()">אחרון</button>

  <form class="jump" (submit)="$event.preventDefault(); jump(pageInput)">
    <label>
      מעבר לדף
      <input #pageInput type="text" inputmode="numeric" maxlength="25" [class.invalid]="jumpError()" />
    </label>
    <button type="submit" [disabled]="disabled()">עבור</button>
    @if (jumpError()) {
      <span class="error" role="alert">יש להזין מספר דף בין 1 ל-{{ totalPages() | bigNumber }}</span>
    }
  </form>
</nav>
