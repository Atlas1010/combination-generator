name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:7.4-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_CONNECTION: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: server/global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: dotnet list package --vulnerable --include-transitive

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  docker:
    runs-on: ubuntu-latest
    needs: [ server, client ]
    strategy:
      fail-fast: false
      matrix:
        store: [ Memory, Redis ]
    env:
      SESSION_STORE: ${{ matrix.store }}
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway guest signing key
        run: echo "GUEST_SIGNING_KEY=$(openssl rand -base64 48)" > .env
      - run: docker compose --profile redis build
      - run: docker compose --profile redis up -d --wait
      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:8080
          call() {
            local name=$1; shift
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$@" || true)
            if [[ ! $code =~ ^2 ]]; then
              echo "::error title=$name failed::HTTP $code $(head -c 500 /tmp/body 2>/dev/null | tr '\n' ' ')" >&2
              exit 1
            fi
            cat /tmp/body
          }
          for i in $(seq 1 60); do
            docker compose logs api | grep -q "Application started" && break
            sleep 2
          done
          call home "$base/" | grep -q '<app-root'
          token=$(call guest-token -X POST "$base/api/auth/guest-token" | jq -r .accessToken)
          auth="Authorization: Bearer $token"
          session=$(call start -X POST "$base/api/combinations/start" -H "$auth" -H 'Content-Type: application/json' -d '{"n":3}' | jq -r .sessionId)
          call next -X POST "$base/api/combinations/$session/next" -H "$auth" | jq -e '.combination'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --profile redis logs
          echo "::error title=api logs::$(docker compose logs --no-color --tail 25 api | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - if: always()
        run: docker compose --profile redis down
